tLength="385.8105" x="291" y="206.7402">No se crea MovimientoSaldo: el saldo sigue en 15,00 &#8364; y el stock en 50.</text></g><g class="link" data-entity-1="ed2027" data-entity-2="pv01" data-uid="lnk7" id="link_ed2027_pv01"><path d="M202.5911,264.5 C278.3136,264.5 382.3103,264.5 452.7282,264.5" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="41.1963" x="224" y="259.5103">edicion</text></g><g class="link" data-entity-1="pv01" data-entity-2="prCerveza" data-uid="lnk8" id="link_pv01_prCerveza"><path d="M610.0999,264.5 C686.4788,264.5 801.9491,264.5 874.7349,264.5" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="57.0908" x="798" y="259.5103">productos</text></g><g class="link" data-entity-1="elena" data-entity-2="cr11b" data-uid="lnk9" id="link_elena_cr11b"><path d="M204.1887,98.5 C277.9006,98.5 377.7216,98.5 447.4772,98.5" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="31.7891" x="229" y="93.5103">titular</text></g><!--SRC=[TLJ1Rjj64BtpAwRAfGKiUobLRf4W1rcMq1QmOSH8xiFbYDfukKCibqBj8fTyJthA8VVcJ_ebdLrI5fMslErxmvctRsRdkyPZLIDOVEGkG5jJG8TPCC4IhATvVZw3lxx07LOCcft4GTFPbZp24XuHsgwLsCwK2DzxqZjyuX-odIa9g6x28zHK5-JRpD8sG63mfje5A8t41iCkQn-CQz1Z3GNgXyfpvyeLM_RmOfE-KKH9M-nisB0BjrWJ_49sJy5e_E-OU_D4aCz791VlfIpyaG5S_QlQUhDUhIF3lYG_eCkVbPfV2ZfE-66Kqd6W_qcusSnMgsyJNbzUNIvE4yw-ILXIImtCrGZqw1u6C1ikCQ5ofcO_mKjObqQBbHF05WOm2Z8bl8R9-deQaOa0Zkl2KmINJxX33_THBHneT8Q5Z4SvRMClVtKnS_nZbb-enSKXD94Run8p7pEuPSyt-Bkf-JVs3cKiNaE-K4h99G_AcxtAHVTTvmA_8nSmIK_eKVZTkwdAJsLVeOzZbyH79fWcYIiYFXaNy2loUth2MCLpsUd0VOrdObJepLIfsMcb8Ig26WDLx0scIbJ8f4UuaG4slDIXGolC_6oXuE-FduInblQuj9ft79dWEnAq3QmVvBXGXyEDSU9Ij6Vi3LboKVRRjaDlUjKzTbJyzlwDFCohKydh6FJSd5lKfZRYRJ8eLnVgH-bHRwXFkYROcZP818sTqpxF2oc_ybIIqmPjKj33KO7cqbGfwUfP1BK1ouHfT